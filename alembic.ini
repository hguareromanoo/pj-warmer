# =============================================================================
# Configuração principal do Alembic
# =============================================================================
# Este arquivo é lido toda vez que você roda um comando `alembic ...`. Ele
# diz para o Alembic onde estão os scripts de migração, qual é a URL do banco,
# e como formatar logs/mensagens.
#
# A maior parte dos campos abaixo está nos valores padrão. As únicas coisas
# realmente importantes para o nosso projeto são:
#   - script_location  -> onde ficam as migrações
#   - sqlalchemy.url   -> como conectar no banco (sobrescrito em env.py via .env)
#
# IMPORTANTE: a URL do banco *real* (com a senha do Supabase) NÃO fica aqui.
# Ela é lida do `.env` dentro de `alembic/env.py`. O placeholder abaixo só
# existe para o Alembic não reclamar quando você roda comandos offline.
# =============================================================================

[alembic]
# Caminho relativo (a partir da raiz do projeto) para o diretório das migrações.
script_location = alembic

# Modelo do nome dos arquivos de migração. Inclui a data para facilitar leitura
# cronológica no `ls`. Ex: 2026_04_30_1234-abc123_create_casepj.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Fuso horário usado nos timestamps dos arquivos de migração.
# (Vazio = UTC, que é o que queremos para reprodutibilidade.)
timezone =

# Tamanho máximo do "slug" no nome do arquivo (parte com a mensagem).
truncate_slug_length = 40

# Se True, o Alembic encerra com erro se não houver migrações novas para gerar.
revision_environment = false

# Se True, o Alembic procura arquivos `.py.mako` em script_location/
# em vez de só usar o template embutido. Mantemos false (template padrão).
sourceless = false

# Caminhos onde o Alembic procura por scripts de versão.
version_locations = %(here)s/alembic/versions

# Separador de path do SO (os = pega automático do sistema).
version_path_separator = os

# Codificação dos arquivos. utf-8 é o único valor que faz sentido em 2026.
output_encoding = utf-8

# Placeholder. A URL real vem do .env via env.py.
sqlalchemy.url = postgresql://placeholder


# =============================================================================
# Logging
# =============================================================================
# Configuração padrão recomendada pelo Alembic. Mostra INFO+ no console,
# o que dá o feedback mínimo necessário ao rodar `alembic upgrade head`.
# =============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
